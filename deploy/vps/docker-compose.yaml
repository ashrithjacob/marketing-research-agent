# Production stack for https://marketing.vanis.ai. Lives on the VPS at
# ~/mra-compose/docker-compose.yaml; deployed by deploy/vps/deploy.sh.
#
# Deliberately a separate file from ../../docker-compose.yaml rather than an
# override of it. The local file publishes a port, builds from source, and is
# on-demand; this one publishes nothing, runs a pre-built image, and stays up.
# An override that has to *remove* things (`ports: !reset`, `build: !reset`)
# is harder to read at 2am than two short files that each say what they are.
#
# See setup.md §5a.
name: mra

services:
  mra:
    image: mra:latest
    # Built on the laptop and shipped with `docker load` — see deploy.sh for
    # why it is never built here. `never` makes a missing image an error
    # rather than a silent attempt to pull `mra` from Docker Hub.
    pull_policy: never
    container_name: mra
    # Always-on, unlike the local stack. A restart still kills any run in
    # flight — the agent lives in this process — and recover() marks it failed.
    restart: unless-stopped
    # Never `ports:` — Docker publishes past ufw. Caddy reaches it over `edge`.
    expose: ["8000"]
    networks: [default, edge]
    volumes:
      - mra_data:/data
    environment:
      - MRA_APP_USER=${MRA_APP_USER:-ash}
      # `:?` is the guard: compose refuses to start this stack at all with an
      # empty hash, so an unauthenticated agent with paid API keys cannot end
      # up on a public hostname by accident. Set it once with `npm run hashpw`;
      # the first boot seeds this admin into the `users` table.
      - "MRA_APP_PASSWORD_HASH=${MRA_APP_PASSWORD_HASH:?must be set: it turns login on and seeds the first admin (setup.md 5a)}"
      - MRA_JWT_SECRET=${MRA_JWT_SECRET:?MRA_JWT_SECRET is not set}
      - MRA_COOKIE_SECURE=true
      # The store: Postgres on Neon (Frankfurt, project silent-band-48662060).
      # Required since the avatar rewrite; the server refuses to start without it.
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is not set}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is not set}
      - MRA_MODEL=${MRA_MODEL:?MRA_MODEL must be set in .env - the model id lives only there}
      - MRA_BACKUP_MODELS=${MRA_BACKUP_MODELS:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:?FIRECRAWL_API_KEY is not set}
      # Fallback page reader, used only when Firecrawl can fetch nothing at all
      # (out of credits, key refused, or no key). Optional: blank disables it.
      - CRAWL4AI_API_KEY=${CRAWL4AI_API_KEY:-}
      # Every web_search goes to Parallel. Required: without it no agent can
      # search at all.
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:?PARALLEL_API_KEY is not set}
      # Meta ads (stage 3), shop traction (stage 1), ad history (stage 4).
      # Optional: blank and stage 3 fails with a reason, the rest still run.
      - TRENDTRACK_API_KEY=${TRENDTRACK_API_KEY:-}
      # Stage 4's search volume, Amazon listings and Reddit. Deliberately not
      # `:?`: it spends against a card, so an absent one leaves stage 4 running
      # without those three rather than refusing to boot.
      - APIFY_TOKEN=${APIFY_TOKEN:-}

networks:
  # Shared with Caddy and nothing else. Not `pa-compose_default`: that is the
  # bridge hermes's 172.28.0.1:8642 is firewalled open to, and the research
  # agent reads the open web — it has no business one hop from the chat
  # agent's harness. Created once with `docker network create edge`.
  edge:
    external: true
    name: edge

volumes:
  # Traces (the store is on Neon). Captured nightly by owui-snapshot.sh.
  # The old `mra_corpus` volume is left on the VPS, no longer mounted.
  mra_data: {}
