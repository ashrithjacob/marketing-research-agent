# The research cockpit, locally: the app and its own Postgres. One command:
#
#     cp .env.example .env   # fill in the keys, first time only
#     docker compose up -d --build
#     open http://localhost:8080
#
#     docker compose down    # stop it; the pg_data volume keeps your runs
#
# Two containers. The app runs the agent in-process (pi-agent-core); the store
# is Postgres with pgvector, the same engine the VPS uses on Neon. SQLite went
# on 2026-10-17 with the avatar rewrite (docs/spec.md): the spec's schema needs
# pgvector, and one engine means one set of SQL.
name: mra

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: mra-db
    restart: on-failure
    # No `ports:`. Only the app reaches it, over this stack's own network.
    environment:
      - POSTGRES_USER=mra
      - POSTGRES_PASSWORD=mra
      - POSTGRES_DB=mra
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mra"]
      interval: 2s
      timeout: 3s
      retries: 30

  mra:
    build:
      context: .
      dockerfile: Dockerfile
    image: mra:latest
    container_name: mra
    # Not `unless-stopped`: this stack is on-demand. A restart ends any run in
    # progress; the server marks it `failed` on the way back up.
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    # Bound to 127.0.0.1: with no password set anyone on your network would
    # otherwise reach an unauthenticated agent with web access.
    ports: ["127.0.0.1:8080:8000"]
    volumes:
      - mra_data:/data
    environment:
      - MRA_APP_USER=${MRA_APP_USER:-ash}
      - MRA_APP_PASSWORD_HASH=${MRA_APP_PASSWORD_HASH:-}
      - MRA_JWT_SECRET=${MRA_JWT_SECRET}
      - MRA_COOKIE_SECURE=${MRA_COOKIE_SECURE:-true}
      # Written here, never taken from .env: .env's DATABASE_URL points at Neon,
      # and a local stack must never write to it.
      - DATABASE_URL=postgres://mra:mra@db:5432/mra
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MRA_MODEL=${MRA_MODEL:?MRA_MODEL must be set in .env - the model id lives only there}
      - MRA_BACKUP_MODELS=${MRA_BACKUP_MODELS:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - CRAWL4AI_API_KEY=${CRAWL4AI_API_KEY:-}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - TRENDTRACK_API_KEY=${TRENDTRACK_API_KEY:-}

volumes:
  pg_data: {}
  mra_data: {}
